<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AiUniverse</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0B0B0D;color:#F4F4F5;font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding-bottom:96px}
h1,h2,.zahl{font-family:"Space Grotesk",sans-serif}
.kopf{padding:16px 16px 12px;background:linear-gradient(180deg,#17171C,#0B0B0D);border-bottom:1px solid #23232B;position:sticky;top:0;z-index:5}
.zeile{display:flex;align-items:center;justify-content:space-between;gap:12px}
.punkt{width:9px;height:9px;border-radius:50%;background:#2ED06E;box-shadow:0 0 10px rgba(46,208,110,.8);flex:none}
.punkt.aus{background:#4A4A54;box-shadow:none}
.kname{font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unter{font-size:11px;color:#7E7E89;margin-top:1px}
.knopf{background:#1C1C22;border:1px solid #2A2A32;color:#A7A7B2;border-radius:9px;padding:8px 11px;font:inherit;font-size:13px;cursor:pointer}
.knopf:active{background:#24242C}
.or{background:#FF6A1A;border:none;color:#140B04;font-weight:700;font-family:"Space Grotesk",sans-serif;letter-spacing:.03em}
.rot{color:#FF6B6B}
.stand{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:12px}
.stand>div{background:#15151A;border:1px solid #24242C;border-radius:10px;padding:8px 4px;text-align:center}
.stand .t{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#74747F}
.stand .w{font-size:11.5px;font-weight:600;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gruen{color:#2ED06E}.grau{color:#6E6E79}
.reiter{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:12px 16px 0}
.reiter button{background:#15151A;border:1px solid #26262E;border-radius:12px;padding:11px 4px;color:#A7A7B2;font:inherit;font-size:10.5px;font-weight:600;cursor:pointer;line-height:1.3}
.reiter button.an{background:#FF6A1A;border-color:#FF6A1A;color:#140B04;box-shadow:0 6px 16px rgba(255,106,26,.32)}
.erkl{display:flex;gap:9px;margin:11px 16px 0;padding:11px 12px;background:rgba(255,106,26,.07);border:1px solid rgba(255,106,26,.25);border-radius:12px;font-size:11.5px;line-height:1.5;color:#C9C9D2}
.erkl i{width:7px;height:7px;border-radius:50%;background:#FF6A1A;margin-top:5px;flex:none}
.inhalt{padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.karte{background:linear-gradient(180deg,#1A1A20,#141418);border:1px solid #272730;border-radius:16px;padding:4px 13px;box-shadow:0 10px 28px rgba(0,0,0,.45)}
.karte.p{padding:13px}
.kt{font-family:"Space Grotesk",sans-serif;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:#8E8E99;margin:0 0 9px}
.r{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #23232B}
.r:last-child{border-bottom:none}
.r label,.r .lb{font-size:12.5px;color:#C9C9D2}
.r .hint{font-size:10.5px;color:#7E7E89;margin-top:2px}
input[type=text],input[type=number],select,textarea{background:#0E0E12;border:1px solid #2C2C35;border-radius:9px;color:#F4F4F5;padding:8px 9px;font:inherit;font-size:12.5px}
input[type=text],input[type=number]{text-align:right;width:92px}
input.breit{text-align:left;width:100%}
select{width:auto}
textarea{width:100%;text-align:left;resize:vertical;min-height:92px;line-height:1.55;font-size:12px}
.sch{width:46px;height:26px;border-radius:999px;background:#2A2A32;position:relative;flex:none;border:none;cursor:pointer;padding:0}
.sch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#6E6E79;transition:.15s}
.sch.an{background:#FF6A1A}.sch.an i{left:23px;background:#140B04}
.pills{display:flex;gap:5px;flex-wrap:wrap}
.pills button{background:#1E1E25;border:1px solid #2C2C35;color:#8E8E99;border-radius:8px;padding:6px 10px;font:inherit;font-size:11px;cursor:pointer}
.pills button.an{background:#FF6A1A;border-color:#FF6A1A;color:#140B04;font-weight:600}
.liste .e{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #202028}
.liste .e:last-child{border-bottom:none}
.e .tx{flex:1;min-width:0}
.e .ti{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e .me{font-size:10.5px;color:#7E7E89;margin-top:2px}
.ik{width:34px;height:34px;border-radius:9px;background:#1E1E25;border:1px solid #2C2C35;color:#E6E6EA;font-size:14px;cursor:pointer;flex:none}
.leer{color:#6E6E79;font-size:12px;padding:12px 0;text-align:center}
.leiste{position:fixed;left:0;right:0;bottom:0;padding:11px 16px calc(14px + env(safe-area-inset-bottom));background:#0B0B0D;border-top:1px solid #23232B;display:flex;flex-wrap:wrap;align-items:center;gap:11px;z-index:6}
.lauf{flex:0 0 100%;display:none;align-items:center;gap:9px;padding:8px 11px;margin:-2px 0 2px;background:#17171C;border:1px solid #2A2A33;border-radius:11px;font-size:12.5px;color:#D2D2DA}
.lauf.an{display:flex}
.lauf .pk{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:#E8711A;animation:pul 1.3s ease-in-out infinite}
.lauf .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lauf .zt{flex:0 0 auto;color:#9A9AA4;font-variant-numeric:tabular-nums}
@keyframes pul{0%,100%{opacity:1}50%{opacity:.25}}
.leiste .pr{flex:none}
.leiste .pr .t{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#74747F}
.leiste .pr .w{font-size:19px;font-weight:700;font-family:"Space Grotesk",sans-serif}
.gen{flex:1;border-radius:14px;padding:16px 10px;font-size:15px}
.dim{position:fixed;inset:0;background:rgba(5,5,7,.78);z-index:20;display:flex;align-items:flex-end;padding:16px}
.dlg{background:linear-gradient(180deg,#1D1D24,#141418);border:1px solid #33333E;border-radius:22px;padding:20px;width:100%;box-shadow:0 28px 60px rgba(0,0,0,.8)}
.dlg h2{margin:0 0 4px;font-size:18px}
.dlg p{margin:0 0 14px;font-size:12.5px;color:#8E8E99;line-height:1.5}
.dlg .zw{display:flex;gap:10px}
.dlg .zw button{flex:1;border-radius:14px;padding:15px 8px;font-size:14px}
.log{font:11px/1.6 ui-monospace,monospace;color:#9A9AA4;white-space:pre-wrap;word-break:break-word;max-height:170px;overflow:auto}
.hinw{font-size:10.5px;color:#6E6E79;padding:4px 0 10px}
.kind{padding-left:16px}
.szn{background:#15151A;border:1px solid #24242C;border-radius:12px;padding:10px;margin-bottom:9px}
.szn .kopf{display:flex;align-items:center;gap:8px;margin-bottom:8px;position:static;top:auto;z-index:auto;padding:0;background:none;border-bottom:0}
.szn .nr{font-size:10px;color:#74747F;letter-spacing:.08em;flex:1}
.szn .bildchen{width:100%;height:132px;object-fit:cover;border-radius:9px;background:#0B0B0D;display:block}
.szn textarea{width:100%;min-height:58px;margin-top:8px}
.szz{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.szh{font-size:10.5px;color:#7E7E89}
.hak{display:flex;align-items:center;gap:6px;font-size:12px;color:#A7A7B2;cursor:pointer}
.hak input{width:17px;height:17px;accent-color:#FF6A1A}
.hak.aus{opacity:.45}
.szn select,.szn input[type=text]{font-size:12px}
.raster{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.zl{background:#15151A;border:1px solid #23232B;border-radius:9px;padding:7px 9px}
.zt{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:#74747F}
.zw{font-size:12px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me.warn{color:#FF6A1A}
.suchf{margin:12px 16px 0;position:relative}
.suchf input[type=text]{width:100%;box-sizing:border-box;text-align:left;background:#15151A;border:1px solid #26262E;border-radius:12px;padding:11px 13px;color:#F4F4F5;font:inherit;font-size:13.5px}
.suchf input::placeholder{color:#6B6B78}
.sucherg:empty{display:none}
.sucherg{position:absolute;left:0;right:0;top:46px;z-index:40;background:#17171D;border:1px solid #2E2E38;border-radius:12px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.sucherg div{padding:11px 13px;border-bottom:1px solid #22222A;font-size:13px;cursor:pointer}
.sucherg div:last-child{border-bottom:none}
.sucherg div:active{background:#22222A}
.sucherg b{color:#FF6A1A;font-weight:600}
.sucherg span{display:block;color:#7E7E8B;font-size:11px;margin-top:2px}
.treffer{animation:blitz 2s ease-out}
@keyframes blitz{0%,55%{background:rgba(255,106,26,.22)}100%{background:transparent}}
.spaeter{margin:0 0 4px;padding:10px 12px;background:#15151A;border:1px dashed #33333E;border-radius:11px;font-size:11.5px;line-height:1.5;color:#8A8A96}
input[type=range]{-webkit-appearance:none;appearance:none;height:16px;border-radius:8px;
 outline:none;border:1px solid #2C2C35;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;
 border-radius:50%;background:#fff;border:2px solid #0B0B0D;box-shadow:0 1px 4px rgba(0,0,0,.7)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;
 border:2px solid #0B0B0D}
</style>
</head>
<body>

<div class="kopf">
  <div class="zeile">
    <div style="display:flex;align-items:center;gap:9px;min-width:0">
      <span class="punkt" id="pt"></span>
      <div style="min-width:0">
        <div class="kname" id="knam">—</div>
        <div class="unter" id="kunt"></div>
      </div>
    </div>
    <button class="knopf" onclick="zeige('kanaele')">Kanäle</button>
  </div>
  <div class="stand" id="stand"></div>
</div>

<div class="suchf"><input type="text" id="suchf" placeholder="Suchen: Untertitel, Follow, Musik, Tempo …" oninput="suchTreffer(this.value)" onblur="setTimeout(suchZu,220)"><div class="sucherg" id="sucherg"></div></div>
<div class="reiter" id="reiter"></div>
<div class="erkl"><i></i><span id="erkl"></span></div>
<div class="inhalt" id="inhalt"></div>

<div class="leiste" id="leiste">
  <div class="lauf" id="lauf"><span class="pk"></span><span class="tx" id="laufTx">läuft …</span><span class="zt" id="laufZt"></span></div>
  <div class="pr"><div class="t">Kostet</div><div class="w" id="preis">—</div></div>
  <button class="knopf or gen" id="gen" onclick="fragGenerieren()">VIDEO ERZEUGEN</button>
</div>

<div id="dialog"></div>

<script>
var S={kanal:null,tab:"start",daten:{},einst:{},themen:{offen:[],erledigt:[]},videos:[],preis:{},modelle:null,szenen:null,tg:null,fig:null,gs:null,arten:null,vorlagen:{},schluessel:{},guthaben:null,schriften:null};

var TABS=[
 ["start","Übersicht","Hier startest du ein Video von Hand, schaltest die Automatik und siehst die fertigen Videos."],
 ["prompt","Prompt","Worüber der Kanal spricht und in welchem Ton. Die Themenliste wird von oben abgearbeitet, erledigte kommen nicht wieder."],
 ["figuren","Charaktere","Figuren mit fester Stimme und freigestellten Posen. Im Szenen-Editor waehlst du, wer wo im Bild steht."],
 ["video","Video & Ton","Wie das Video aussieht und klingt: Format, Bildwechsel, Bewegung, Stimme, Musik."],
 ["texte","Text & Einblendung","Untertitel und Einblendungen. Schrift, Größe, Höhe im Bild, Farbe des mitlaufenden Wortes."],
 ["technik","KI & Technik","Welcher Dienst welche Arbeit macht, was er kostet und ob sein Schlüssel hinterlegt ist."]
];

function h(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function api(w,d){return fetch(w,d?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)}:undefined).then(function(r){return r.headers.get("content-type").indexOf("json")>=0?r.json():r.text()})}
function el(id){return document.getElementById(id)}

function frage(titel,text,knopf,fn,gefahr){
  el("dialog").innerHTML='<div class="dim" onclick="if(event.target===this)zu()"><div class="dlg">'
   +'<h2>'+h(titel)+'</h2><p>'+text+'</p><div class="zw">'
   +'<button class="knopf" onclick="zu()">Abbrechen</button>'
   +'<button class="knopf '+(gefahr?"":"or")+'" id="ja" style="'+(gefahr?"background:#B02A2A;border-color:#B02A2A;color:#fff;font-weight:700":"")+'">'+h(knopf)+'</button>'
   +'</div></div></div>';
  el("ja").onclick=function(){zu();fn()};
}
function zu(){el("dialog").innerHTML=""}
function melde(t){el("dialog").innerHTML='<div class="dim" onclick="zu()"><div class="dlg"><h2>Hinweis</h2><p>'+h(t)+'</p><div class="zw"><button class="knopf or" onclick="zu()">Alles klar</button></div></div></div>'}

function kanalDaten(){for(var i=0;i<(S.daten.kanaele||[]).length;i++){if(S.daten.kanaele[i].key===S.kanal)return S.daten.kanaele[i]}return null}

function laden(){
  return api("/api/stand").then(function(d){
    S.daten=d;
    var ks=d.kanaele||[];
    if(!S.kanal||!kanalDaten()){
      var gm=kanalGemerkt(), da=false;
      for(var i=0;i<ks.length;i++){if(ks[i].key===gm)da=true}
      S.kanal=da?gm:(ks.length?ks[0].key:null);
    }
    zeigeKopf();
    if(!S.kanal)return;
    return Promise.all([
      api("/api/kanal?k="+S.kanal).then(function(x){S.einst=x}),
      api("/api/themen?k="+S.kanal).then(function(x){S.themen=x}),
      api("/api/videos?k="+S.kanal).then(function(x){S.videos=x}),
      api("/api/preis?k="+S.kanal).then(function(x){S.preis=x}),
      api("/api/stand?k="+S.kanal).then(function(x){S.daten.apis=x.apis})
    ]).then(function(){zeigeKopf();zeichne()});
  });
}

function zeigeKopf(){
  var k=kanalDaten();
  el("knam").textContent=k?k.name:"Kein Kanal";
  var vn=(S.vorlagen[k&&k.vorlage]||{}).name||(k?k.vorlage:"");
  el("kunt").textContent=k?(vn+" · "+(k.sprachen||["de"])[0]+" · "+(S.einst.format||"9:16")):"";
  el("pt").className="punkt"+(k&&k.aktiv?"":" aus");
  var a=S.daten.apis||{};
  var g=S.guthaben&&S.guthaben.ok?(Number(S.guthaben.betrag).toFixed(2)+" "+(S.guthaben.waehrung==="USD"?"$":S.guthaben.waehrung)):"—";
  el("stand").innerHTML=
    kachel("Text",a.text?kurz(a.text_name,"Claude"):"fehlt",a.text)+
    kachel("Bild",a.bilder?kurz(a.bilder_name,"Flux"):"fehlt",a.bilder)+
    kachel("Stimme",a.stimme?kurz(a.stimme_name,"bereit"):"fehlt",a.stimme)+
    kachel("fal.ai",g,S.guthaben&&S.guthaben.ok);
}
function kurz(n,fallback){n=(n||"").trim();return n?n:fallback}
function kachel(t,w,ok){return '<div><div class="t">'+t+'</div><div class="w '+(ok?"gruen":"grau")+'">'+h(w)+'</div></div>'}

function zeige(t){S.tab=t;zeichne()}


function laufZeit(s){
  s=Math.max(0,Math.round(Number(s)||0));
  var m=Math.floor(s/60); s=s%60;
  return m+":"+(s<10?"0":"")+s;
}
function laufLeiste(){
  var k=el("lauf"); if(!k)return;
  var l=S.daten.lauf||{};
  if(!l.laeuft){k.className="lauf";return}
  var z=(l.zeilen||[]).filter(function(x){return (x||"").trim()});
  var letzte=z.length?z[z.length-1]:"läuft …";
  el("laufTx").textContent=letzte;
  el("laufZt").textContent=laufZeit(l.sekunden);
  k.className="lauf an";
}

function zeichne(){
  el("reiter").innerHTML=TABS.map(function(t){
    return '<button class="'+(S.tab===t[0]?"an":"")+'" onclick="zeige(\''+t[0]+'\')">'+h(t[1])+'</button>'}).join("");
  var e=TABS.filter(function(t){return t[0]===S.tab})[0];
  el("erkl").textContent=e?e[2]:"Kanäle anlegen, klonen oder löschen. Ein Kanal macht genau eine Videoart.";
  el("leiste").style.display=(S.tab==="kanaele")?"none":"flex";
  el("preis").textContent=(S.preis.gesamt!=null?S.preis.gesamt.toFixed(2).replace(".",","):"—")+" €";
  var f={start:tStart,prompt:tPrompt,figuren:tFiguren,video:tVideo,texte:tTexte,technik:tTechnik,kanaele:tKanaele}[S.tab]||tStart;
  el("inhalt").innerHTML=f();
  laufLeiste();
  if(S.tab==="texte")p70Lade();
}

/* ---------- Bausteine ---------- */
function reihe(label,rechts,hint){
  return '<div class="r"><div><div class="lb">'+h(label)+'</div>'+(hint?'<div class="hint">'+h(hint)+'</div>':'')+'</div>'+rechts+'</div>'
}
function zahl(feld,wert,breit){
  return '<input type="number" value="'+h(wert)+'" onchange="setz(\''+feld+'\',this.value,1)">'
}
function text(feld,wert){
  return '<input type="text" value="'+h(wert)+'" onchange="setz(\''+feld+'\',this.value)">'
}
function schalter(feld,an){
  return '<button class="sch'+(an?" an":"")+'" onclick="setz(\''+feld+'\','+(an?"false":"true")+')"><i></i></button>'
}
function wahl(feld,wert,liste){
  return '<select onchange="setz(\''+feld+'\',this.value)">'+liste.map(function(o){
    var v=o[0],n=o[1];return '<option value="'+h(v)+'"'+(String(wert)===String(v)?" selected":"")+'>'+h(n)+'</option>'}).join("")+'</select>'
}
function knoepfe(feld,wert,liste){
  return '<div class="pills">'+liste.map(function(o){
    return '<button class="'+(String(wert)===String(o[0])?"an":"")+'" onclick="setz(\''+feld+'\',\''+o[0]+'\')">'+h(o[1])+'</button>'}).join("")+'</div>'
}
function frHex(h,s,l){
  s=s/100; l=l/100;
  var k=function(n){return (n+h/30)%12};
  var a=s*Math.min(l,1-l);
  var f=function(n){var v=l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
                    return Math.round(255*v)};
  return '#'+[f(0),f(8),f(4)].map(function(x){return ('0'+x.toString(16)).slice(-2)})
         .join('').toUpperCase();
}
function frHsl(hex){
  var s=String(hex||'#FFFFFF').replace('#','');
  if(s.length!==6)s='FFFFFF';
  var r=parseInt(s.substr(0,2),16)/255, g=parseInt(s.substr(2,2),16)/255, b=parseInt(s.substr(4,2),16)/255;
  var mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn, h=0, l=(mx+mn)/2;
  var sa=d===0?0:d/(1-Math.abs(2*l-1));
  if(d!==0){
    if(mx===r)h=60*(((g-b)/d)%6);
    else if(mx===g)h=60*(((b-r)/d)+2);
    else h=60*(((r-g)/d)+4);
  }
  if(h<0)h+=360;
  return [Math.round(h), Math.round(sa*100), Math.round(l*100)];
}
function frZeig(id,feld,speichern){
  var h=+el(id+'_h').value, s=+el(id+'_s').value, l=+el(id+'_l').value;
  var hex=frHex(h,s,l);
  el(id+'_v').style.background=hex;
  el(id+'_s').style.background='linear-gradient(90deg,'+frHex(h,0,l)+','+frHex(h,100,l)+')';
  el(id+'_l').style.background='linear-gradient(90deg,#000,'+frHex(h,s,50)+',#fff)';
  if(speichern)setz(feld,hex);
}
function farbregler(feld,wert,standard){
  var hex=String(wert||standard||'#FFFFFF').toUpperCase();
  var p=frHsl(hex), id='fr'+feld.replace(/[^a-z0-9]/gi,'');
  var ruf=function(sp){return 'frZeig(\''+id+'\',\''+feld+'\','+(sp?'1':'0')+')'};
  var reg=function(teil,wert,max,hg){
    return '<input type="range" id="'+id+'_'+teil+'" min="0" max="'+max+'" value="'+wert+'"'
     +' style="width:100%;background:'+hg+'" oninput="'+ruf(0)+'" onchange="'+ruf(1)+'">';
  };
  return '<div style="display:flex;align-items:center;gap:9px">'

function utStandard(welche){
  /* genauso gerechnet wie in szenen_video.py, bei 1920 Pixeln Hoehe */
  var st=(S.einst.untertitel_stil||"klassisch");
  var n=+(S.einst.untertitel_woerter||3);
  var g=Math.max(20,Math.min(120,+(S.einst.untertitel_groesse||48)));
  var sh={1:1.12,2:1.0,3:0.88,4:0.78,5:0.70,6:0.64}[n]||0.78;
  var H=1920, fs, mv, rand, scha;
  if(st==="kino"){
    fs=Math.max(18,Math.floor(H*0.032*g/48*(0.92+0.08*sh)));
    mv=47; rand=Math.max(2,Math.floor(fs*0.10)); scha=0;
  }else if(st==="fett"){
    fs=Math.max(28,Math.floor(H*0.058*g/48*sh));
    mv=30; rand=Math.max(4,Math.floor(fs*0.14)); scha=Math.max(2,Math.floor(fs*0.06));
  }else if(st==="knall"){
    fs=Math.max(30,Math.floor(H*0.056*g/48*sh));
    mv=34; rand=Math.max(4,Math.floor(fs*0.15)); scha=Math.max(2,Math.floor(fs*0.07));
  }else if(st==="karaoke"){
    fs=Math.max(28,Math.floor(H*0.050*g/48*sh));
    mv=40; rand=Math.max(3,Math.floor(fs*0.13)); scha=0;
  }else if(st==="wortweise"){
    fs=Math.max(30,Math.floor(H*0.050*g/48*sh));
    mv=47; rand=Math.max(3,Math.floor(fs*0.10)); scha=0;
  }else{  /* klassisch wird an einer ganz anderen Stelle gebaut */
    fs=Math.max(24,Math.floor(H*0.046*g/48));
    mv=17; rand=Math.max(3,Math.floor(fs*0.11)); scha=Math.max(2,Math.floor(fs*0.07));
  }
  if(welche==="hoehe")return mv;
  if(welche==="rand")return Math.min(30,rand);
  return Math.min(40,scha);
}

function hochladen(zweck,sid){
  var i=document.createElement("input");
  i.type="file";
  i.accept=(zweck==="musik")?"audio/*":"image/*,video/*";
  i.onchange=function(){
    var f=i.files&&i.files[0];if(!f)return;
    if(f.size>90*1024*1024){melde("Datei zu groß — höchstens 90 MB.");return}
    el("dialog").innerHTML='<div class="dim"><div class="dlg"><h2>Lädt hoch</h2><p id="hpro">'+h(f.name)+' · 0 %</p></div></div>';
    var x=new XMLHttpRequest();
    x.open("POST","/api/hochladen?k="+encodeURIComponent(S.kanal)+"&zweck="+zweck+"&name="+encodeURIComponent(f.name)+(sid?("&sid="+encodeURIComponent(sid)):""));
    x.upload.onprogress=function(e){if(e.lengthComputable&&el("hpro"))el("hpro").textContent=f.name+" · "+Math.round(e.loaded/e.total*100)+" %"};
    x.onload=function(){zu();var r={};try{r=JSON.parse(x.responseText)}catch(err){}
      if(!r.ok)return melde(r.fehler||"Hochladen ging nicht");ladeSzenen()};
    x.onerror=function(){zu();melde("Hochladen fehlgeschlagen — Verbindung weg?")};
    x.send(f);
  };
  i.click();
}

  return api("/api/clip_stand?k="+S.kanal).then(function(d){

    zeichne();
  });
}
function clipStand(id){
  var l=((R6.stand||{}).szenen)||[];

}

}

var STIMMUNG=[["ruhig","ruhig"],["sachlich","sachlich"],["normal","normal"],["lebendig","lebendig"],["dramatisch","dramatisch"]];
var ENERGIE={ruhig:0.15,sachlich:0.35,normal:0.55,lebendig:0.75,dramatisch:0.92};
function stimmungName(e){
  e=Number(e); if(isNaN(e))e=0.6;
  var beste="normal",ab=9;
  for(var k in ENERGIE){var d=Math.abs(ENERGIE[k]-e); if(d<ab){ab=d;beste=k}}
  return beste;
}
function stimmenListe(){return (S.einst.stimmen||[]).filter(function(x){return x&&x.name})}
function stimmenKarte(){
  var li=stimmenListe(), aktiv=(S.einst.stimme_id||"");
  var o='<div class="karte p"><h2 class="kt">Stimmen</h2><div class="liste">';
  if(!li.length)o+='<div class="leer">keine eingetragen — dann nimmt er die Standardstimme des Modells</div>';
  li.forEach(function(e,i){
    var an=(e.id&&e.id===aktiv);
    o+='<div class="e"><button class="ik" style="'+(an?"background:#FF6A1A;border-color:#FF6A1A;color:#140B04":"")+'"'
      +' onclick="stimmeAktiv('+i+')">'+(an?"●":"○")+'</button>'
      +'<div class="tx" onclick="stimmeBearbeiten('+i+')"><div class="ti">'+h(e.name)+'</div>'
      +'<div class="me">'+h(e.id||"ohne ID")+'</div></div>'
      +'<button class="ik rot" onclick="stimmeWeg('+i+',\''+h(e.name).replace(/'/g,"")+'\')">✕</button></div>';
  });
  o+='</div><button class="knopf" style="width:100%;margin:9px 0 4px" onclick="stimmeNeu()">+ Stimme</button>'
   +reihe("Grundstimmung",knoepfeStimmung(stimmungName(S.einst.stimme_energie)),"gilt, wo bei der Szene nichts anderes steht")
   +'<div class="hinw" style="margin-top:8px">Die ID steht in deinem ElevenLabs-Konto bei der Stimme. '
   +'Der Name ist frei wählbar und wird im Szenen-Editor unter „Figur“ benutzt.</div></div>';
  return o;
}
function knoepfeStimmung(jetzt){
  return '<div class="pills">'+STIMMUNG.map(function(o){
    return '<button class="'+(jetzt===o[0]?"an":"")+'" onclick="setz(\'stimme_energie\','+ENERGIE[o[0]]+')">'+h(o[1])+'</button>'}).join("")+'</div>';
}
function stimmeForm(titel,i,e){
  e=e||{};

function poseHochBewegt(n){

    x.upload.onprogress=function(e){if(e.lengthComputable&&el("hpro"))el("hpro").textContent=f.name+" · "+Math.round(e.loaded/e.total*100)+" %"};
    x.onload=function(){zu();var r={};try{r=JSON.parse(x.responseText)}catch(err){}

  if(!alt.trim()){setze();return}
  frage(titel+": Vorschlag einsetzen?",
    (warnung?"<b>"+h(warnung)+"</b><br><br>":"")
    +"Dein bisheriger Text wird dabei <b>\u00fcberschrieben</b> und ist weg.<br><br>"
    +"Bisher:<br><br><i>"+p86Kurz(alt)+"</i><br><br>"
    +"Vorschlag:<br><br><i>"+p86Kurz(wert)+"</i>",
    "\u00dcberschreiben",setze,true);
}

function ankerVorschlag(){
  p86Vorschlag("stil_zusatz","Stil-Anker","anker",
    "gleiche Figur wie auf der Vorlage, gleiche Koerperform und Kopfgroesse, ganzer Koerper im Bild, weiches Studiolicht, keine Schrift auf der Kleidung",
    "Dieser Vorschlag ist f\u00fcr Kan\u00e4le mit einer festen Figur gedacht. Bei einem Kanal ohne Figur passt er nicht.");
}


function bewegVorschlag(){
  p86Vorschlag("kling_prompt","Bewegung im Bild","bewegfeld",
    "die Figur bewegt sich lebendig: Gewicht verlagert sich, Haare und Kleidung schwingen mit, kleine Gesten mit den Haenden, Kopf dreht sich leicht, Blick zur Kamera, Kamera bleibt ruhig",
    "Dieser Vorschlag setzt voraus, dass eine Figur im Bild steht.");
}


function textSchreiben(){
  var b=el("gsknopf"); if(!b)return;
  var thema=(el("gsthema")||{}).value||"";
  b.disabled=true; b.textContent="schreibt…";
  api("/api/vorschlag?k="+S.kanal,{thema:thema}).then(function(r){
    b.disabled=false; b.textContent="Schreiben";
    if(!r||!r.ok)return melde((r&&r.fehler)||"Die Text-KI hat nicht geantwortet");
    var d={geschichte_teil:0};
    if(r.thema&&r.thema_aus_liste)d.geschichte_thema=r.thema;
    var teile=serieTeile(r.text);
    if(teile.length>1){
      d.geschichte_serie=r.text;
      d.geschichte_text=teile[0];
    } else {
      d.geschichte_serie="";
      d.geschichte_text=r.text;
    }
    var f=el("gstext"); if(f)f.value=d.geschichte_text;
    setzViele(d).then(function(){
      if(teile.length>1)melde((r.titel?r.titel+" · ":"")+teile.length+" Teile gespeichert. Teil 1 steht im Feld.");
      else melde((r.titel?r.titel+" · ":"")+r.szenen+" Szenen geschrieben. Lies drüber, dann erzeugen.");
    });
  }).catch(function(){
    b.disabled=false; b.textContent="Schreiben";
    melde("Verbindung abgebrochen. Das Schreiben dauert bis zu zwei Minuten.");
  });
}


/* ---------- Serien ---------- */
function serieTeile(text){
  var roh=(text||"").split(/^[ \t]*#{3,}[ \t]*$/m), raus=[];
  for(var i=0;i<roh.length;i++){var s=roh[i].trim(); if(s)raus.push(s)}
  return raus;
}
function serieLeiste(){
  var n=Number(S.einst.serie_teile||1);
  var teile=serieTeile(S.einst.geschichte_serie||"");
  if(n<2 && teile.length<2) return '';
  if(!teile.length) return '<div class="hinw" style="padding-top:0">Serie mit '+n+' Teilen eingestellt. '
    +'Drück auf Schreiben, dann wird der ganze Fall am Stück geschrieben und hier in Teile zerlegt.</div>';
  var jetzt=Number(S.einst.geschichte_teil||0);
  var o='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px">';
  for(var i=0;i<teile.length;i++){
    o+='<button class="knopf'+(i===jetzt?' or':'')+'" style="flex:1 1 auto;min-width:74px" '
      +'onclick="teilWaehlen('+i+')">Teil '+(i+1)+'</button>';
  }
  o+='</div><div class="hinw" style="padding-top:0">'+teile.length+' Teile. '
   +'Der gewählte steht unten im Feld — erzeugen, dann den nächsten wählen.</div>';
  return o;
}
function teilWaehlen(i){
  var teile=serieTeile(S.einst.geschichte_serie||"");
  if(!teile[i])return;
  var f=el("gstext"); if(f)f.value=teile[i];
  setzViele({geschichte_teil:i, geschichte_text:teile[i]});
}

 .then(function(s){S.schluessel=s;return laden()})
 .then(function(){setInterval(function(){if((S.daten.lauf||{}).laeuft)laden()},4000)});
